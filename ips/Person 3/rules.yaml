# rules.yaml - all thresholds for the rule-based detector.
# Change numbers here, not in detector.py. The file is VALIDATED when it is loaded:
# a missing, misspelled or out-of-range key stops the program with a clear message.
# Confidence grows linearly from base_confidence (value == threshold)
# to max_confidence (value >= 3 x threshold).

settings:
  benign_confidence: 0.90      # confidence reported when no rule fires

# Rules are listed from most to least severe. If two rules give the
# same confidence, the earlier one wins.
rules:
  dos:
    enabled: true
    attack_type: "DoS"
    mitre_technique: "T1498"          # Network Denial of Service
    min_rate: 1000                    # features: Rate (packets/s)
    min_syn_count: 100                # features: syn_count
    min_connection_attempts: 1000     # context: a high rate from fewer connections is a bulk transfer, not a flood
                                      # (checked only when the event carries connection_attempts; 0 disables the check)
    base_confidence: 0.80
    max_confidence: 0.99

  brute_force:
    enabled: true
    attack_type: "Brute Force"
    mitre_technique: "T1110"          # Brute Force
    target_ports: [22, 23, 554]       # SSH, Telnet, RTSP
    min_failed_attempts: 50           # context: failed_attempts (failed logins only)
    base_confidence: 0.80
    max_confidence: 0.98

  port_scan:
    enabled: true
    attack_type: "Port Scan"
    mitre_technique: "T1046"          # Network Service Discovery
    min_unique_ports: 20              # context: unique_dst_ports
    min_unique_destinations: 10       # context: unique_dst_ips
    base_confidence: 0.75
    max_confidence: 0.97

  unexpected_traffic:
    enabled: true
    attack_type: "Unexpected Protocol/Port"
    mitre_technique: "T1571"          # Non-Standard Port
    confidence_one_violation: 0.60    # only port OR protocol is wrong
    confidence_both_violations: 0.75  # port AND protocol are wrong
